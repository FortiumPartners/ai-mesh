name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  validate:
    name: Validate Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Validate plugin.json
        run: |
          echo "Validating plugin.json..."
          node -e "
            const fs = require('fs');
            const plugin = JSON.parse(fs.readFileSync('.claude-plugin/plugin.json', 'utf8'));

            // Validate required fields
            if (!plugin.name) throw new Error('Missing plugin name');
            if (!plugin.version) throw new Error('Missing plugin version');
            if (!plugin.description) throw new Error('Missing plugin description');
            if (!plugin.author) throw new Error('Missing plugin author');

            // Validate version matches tag
            const tag = process.env.GITHUB_REF.replace('refs/tags/v', '');
            if (plugin.version !== tag) {
              throw new Error(\`Version mismatch: plugin.json has \${plugin.version}, tag is \${tag}\`);
            }

            console.log('✓ plugin.json is valid');
            console.log(\`✓ Version \${plugin.version} matches tag\`);
          "
        env:
          GITHUB_REF: ${{ github.ref }}

      - name: Lint code
        run: npm run lint

      - name: Run tests
        run: npm test

  release:
    name: Create Release
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Extract changelog
        id: changelog
        run: |
          VERSION=${{ steps.version.outputs.version }}

          # Extract changelog section for this version
          CHANGELOG=$(node -e "
            const fs = require('fs');
            const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
            const versionRegex = new RegExp(\`## \\\\[\${process.env.VERSION}\\\\][^]*?(?=## \\\\[|$)\`, 's');
            const match = changelog.match(versionRegex);
            if (match) {
              console.log(match[0]);
            } else {
              console.log('No changelog entry found for version ' + process.env.VERSION);
            }
          ")

          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          files: |
            .claude-plugin/plugin.json
            README.md
            CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm (if public)
        if: false  # Set to true when ready to publish
        run: |
          npm ci
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
